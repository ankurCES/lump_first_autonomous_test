[package]
name = "dispatchd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dispatchd"
path = "src/main.rs"

[dependencies]
dispatchd-core = { path = "../dispatchd-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
comfy-table = "7"
colored = "2"

[dev-dependencies]
tempfile = "3"
